<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" href="{{ "/assets/img/thewittyswan.png" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ "/" | relative_url }}">
      <img src="{{ "/assets/img/thewittyswan.png" | relative_url }}" alt="thewittyswan">
      <span>thewittyswan</span>
    </a>
    <nav>
      <a href="{{ "/security/" | relative_url }}">security</a>
      <a href="{{ "/literature/" | relative_url }}">literature</a>
      <a href="{{ "/about/" | relative_url }}">about</a>
      <a href="{{ "/feed.xml" | relative_url }}">rss</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ site.time | date: "%Y" }} thewittyswan</p>
  </footer>
</body>
</html>
