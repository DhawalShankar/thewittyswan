---
layout: default
title: Literature
permalink: /literature/
---
<h1>literature</h1>
<ul class="post-list">
{% for post in site.posts %}
  {% if post.categories contains "literature" %}
  <li>
    <span class="post-list-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <a class="post-list-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endif %}
{% endfor %}
</ul>
